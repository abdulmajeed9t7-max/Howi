<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Howi Chat</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="chat-container">
        <!-- Header -->
        <div class="chat-header">
            <div>
                <h2 id="header-title">Howi Chat</h2>
                <span class="user-info" id="user-email">...</span>
            </div>
            <div class="header-actions">
                <button class="lang-btn" id="lang-toggle">اردو</button>
                <button class="logout-btn" id="logout-btn">Logout</button>
            </div>
        </div>

        <!-- Friends View -->
        <div class="friends-view" id="friends-view">
            <div class="friends-title" id="friends-title">Friends</div>
            <div id="friends-list">
                <div class="loading-text">Loading...</div>
            </div>
        </div>

        <!-- Chat View (Hidden initially) -->
        <div class="chat-view hidden" id="chat-view">
            <div class="chat-view-header">
                <button class="back-btn" id="back-btn">←</button>
                <h3 id="chat-with-name">Friend</h3>
            </div>
            <div class="messages-area" id="messages-area"></div>
            <div class="message-input-area">
                <input type="text" id="message-input" placeholder="Type a message..." autocomplete="off">
                <button class="send-btn" id="send-btn">➤</button>
            </div>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
    <script src="firebase-config.js"></script>
    <script src="chat.js?v=100"></script>
</body>
</html>
