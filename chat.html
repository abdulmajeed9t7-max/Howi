<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Howi Chat - Messages</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="lang-switch">
            <button onclick="setLanguage('en')">English</button>
            <button onclick="setLanguage('ur')">اردو</button>
        </div>

        <h1 id="app-title">Messages</h1>
        <p>Welcome, <span id="user-email"></span></p>
        
        <h3 id="friends-title" style="margin-top: 20px;">Friends List:</h3>
        <ul id="users-list" style="list-style: none; padding: 0; text-align: left; margin-top: 10px;">
            <li>Loading...</li>
        </ul>

        <button id="logout-btn" style="margin-top: 20px; background: #e74c3c; color: white; padding: 10px; border: none; border-radius: 5px; cursor: pointer;">Logout</button>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
    <script src="firebase-config.js"></script>

    <script>
        const chatTranslations = {
            en: { title: "Messages", friends: "Friends List", logout: "Logout" },
            ur: { title: "پیغامات", friends: "دوستوں کی فہرست", logout: "لاگ آؤٹ" }
        };

        function setLanguage(lang) {
            if (lang === 'ur') document.body.classList.add('rtl');
            else document.body.classList.remove('rtl');
            document.getElementById('app-title').innerText = chatTranslations[lang].title;
            document.getElementById('friends-title').innerText = chatTranslations[lang].friends;
            document.getElementById('logout-btn').innerText = chatTranslations[lang].logout;
        }
        setLanguage('en');

        firebase.auth().onAuthStateChanged((user) => {
            if (user) {
                document.getElementById('user-email').innerText = user.email;

                const db = firebase.firestore();
                db.collection('users').onSnapshot((snapshot) => {
                    const usersList = document.getElementById('users-list');
                    usersList.innerHTML = "";
                    snapshot.forEach((doc) => {
                        const userData = doc.data();
                        if (userData.email !== user.email) {
                            const li = document.createElement('li');
                            li.innerText = userData.email;
                            li.style.padding = "10px";
                            li.style.borderBottom = "1px solid #ccc";
                            li.style.cursor = "pointer";
                            li.onclick = () => {
                                alert("Aapne " + userData.email + " par click kiya!");
                            };
                            usersList.appendChild(li);
                        }
                    });
                });
            } else {
                window.location.href = "index.html";
            }
        });

        document.getElementById('logout-btn').addEventListener('click', () => {
            firebase.auth().signOut().then(() => {
                window.location.href = "index.html";
            });
        });
    </script>
</body>
</html>
