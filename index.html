<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Howi Chat</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <!-- Language Toggle -->
        <div class="lang-switch">
            <button onclick="setLanguage('en')">English</button>
            <button onclick="setLanguage('ur')">اردو</button>
        </div>

        <h1 id="app-title">Howi Chat</h1>
        
        <!-- Login/Signup Form -->
        <form id="auth-form">
            <input type="text" id="username" placeholder="Username" required>
            <input type="email" id="email" placeholder="Email" required>
            <input type="password" id="password" placeholder="Password" required>
            <button type="submit" id="login-btn">Login</button>
        </form>

        <p id="toggle-text">
            <span id="no-account">No account?</span> 
            <a href="#" id="signup-link">Sign Up</a>
        </p>
        <p id="error-msg" style="color: red; margin-top: 10px;"></p>
    </div>

    <!-- 1. Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
    <!-- Ye line Firestore ke liye hai (Naya add ki hai) -->
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
    
    <!-- 2. Aapki Config File -->
    <script src="firebase-config.js?v=7"></script>
    
    <!-- 3. Aapki App Logic File -->
    <script src="app.js?v=7"></script>
</body>
</html>
